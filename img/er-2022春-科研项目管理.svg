<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">

  <!-- ==================== 样式定义 ==================== -->
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <text font-size="12" text-anchor="middle" y="10">1</text>
    </marker>
    <marker id="arrowN" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <text font-size="12" text-anchor="middle" y="10">N</text>
    </marker>
    <marker id="arrowM" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <text font-size="12" text-anchor="middle" y="10">M</text>
    </marker>
  </defs>

  <!-- ==================== 实体：学院（左上） ==================== -->
  <rect x="50" y="50" width="100" height="50" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="100" y="80" text-anchor="middle" font-weight="bold">学院</text>

  <!-- 学院属性：学院名称 -->
  <ellipse cx="100" cy="15" rx="40" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="100" y="19" text-anchor="middle" font-size="11">学院名称</text>
  <line x1="100" y1="33" x2="100" y2="50" stroke="#333" stroke-width="1.2"/>

  <!-- 学院属性：地址 -->
  <ellipse cx="200" cy="15" rx="28" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="200" y="19" text-anchor="middle" font-size="11">地址</text>
  <line x1="175" y1="25" x2="122" y2="48" stroke="#333" stroke-width="1.2"/>

  <!-- 学院属性：负责人工号 -->
  <ellipse cx="30" cy="15" rx="38" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="30" y="19" text-anchor="middle" font-size="11">负责人工号</text>
  <line x1="48" y1="30" x2="78" y2="48" stroke="#333" stroke-width="1.2"/>

  <!-- ==================== 实体：教师（中上） ==================== -->
  <rect x="330" y="50" width="100" height="50" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="380" y="80" text-anchor="middle" font-weight="bold">教师</text>

  <!-- 教师属性：工号 -->
  <ellipse cx="310" cy="15" rx="28" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="310" y="19" text-anchor="middle" font-size="11">工号</text>
  <line x1="326" y1="30" x2="354" y2="48" stroke="#333" stroke-width="1.2"/>

  <!-- 教师属性：姓名 -->
  <ellipse cx="380" cy="15" rx="28" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="380" y="19" text-anchor="middle" font-size="11">姓名</text>
  <line x1="380" y1="33" x2="380" y2="50" stroke="#333" stroke-width="1.2"/>

  <!-- 教师属性：性别 -->
  <ellipse cx="446" cy="15" rx="28" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="446" y="19" text-anchor="middle" font-size="11">性别</text>
  <line x1="433" y1="30" x2="406" y2="48" stroke="#333" stroke-width="1.2"/>

  <!-- 教师属性：年龄 -->
  <ellipse cx="500" cy="40" rx="28" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="500" y="44" text-anchor="middle" font-size="11">年龄</text>
  <line x1="482" y1="50" x2="422" y2="65" stroke="#333" stroke-width="1.2"/>

  <!-- 教师属性：工作单位 -->
  <ellipse cx="510" cy="80" rx="35" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="510" y="84" text-anchor="middle" font-size="11">工作单位</text>
  <line x1="476" y1="78" x2="430" y2="75" stroke="#333" stroke-width="1.2"/>

  <!-- ==================== 实体：项目（右） ==================== -->
  <rect x="620" y="50" width="100" height="50" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="670" y="80" text-anchor="middle" font-weight="bold">项目</text>

  <!-- 项目属性：项目编号 -->
  <ellipse cx="610" cy="15" rx="38" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="610" y="19" text-anchor="middle" font-size="11">项目编号</text>
  <line x1="626" y1="30" x2="648" y2="48" stroke="#333" stroke-width="1.2"/>

  <!-- 项目属性：项目名称 -->
  <ellipse cx="690" cy="15" rx="38" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="690" y="19" text-anchor="middle" font-size="11">项目名称</text>
  <line x1="690" y1="33" x2="685" y2="50" stroke="#333" stroke-width="1.2"/>

  <!-- 项目属性：项目类型 -->
  <ellipse cx="770" cy="40" rx="38" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="770" y="44" text-anchor="middle" font-size="11">项目类型</text>
  <line x1="752" y1="50" x2="716" y2="65" stroke="#333" stroke-width="1.2"/>

  <!-- 项目属性：资助金额 -->
  <ellipse cx="770" cy="80" rx="38" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="770" y="84" text-anchor="middle" font-size="11">资助金额</text>
  <line x1="740" y1="78" x2="720" y2="75" stroke="#333" stroke-width="1.2"/>

  <!-- 项目属性：执行周期 -->
  <ellipse cx="690" cy="130" rx="38" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="690" y="134" text-anchor="middle" font-size="11">执行周期</text>
  <line x1="688" y1="112" x2="680" y2="100" stroke="#333" stroke-width="1.2"/>

  <!-- ==================== 联系1：隶属（学院-教师，1:N） ==================== -->
  <polygon points="200,160 250,180 200,200 150,180" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="200" y="184" text-anchor="middle" font-size="12">隶属</text>

  <!-- 学院 → 隶属 (1) -->
  <line x1="100" y1="100" x2="158" y2="166" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="135" font-size="12" font-weight="bold" fill="#DC2626">1</text>

  <!-- 教师 → 隶属 (N) -->
  <line x1="372" y1="100" x2="246" y2="166" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="135" font-size="12" font-weight="bold" fill="#DC2626">N</text>

  <!-- ==================== 联系2：主持（教师-项目，M:N） ==================== -->
  <polygon points="450,250 510,275 450,300 390,275" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="450" y="279" text-anchor="middle" font-size="12">主持</text>

  <!-- 教师 → 主持 (M) -->
  <line x1="395" y1="100" x2="426" y2="255" stroke="#333" stroke-width="1.5"/>
  <text x="398" y="180" font-size="12" font-weight="bold" fill="#DC2626">M</text>

  <!-- 项目 → 主持 (N) 注：1-2个主持人 -->
  <line x1="645" y1="100" x2="518" y2="260" stroke="#333" stroke-width="1.5"/>
  <text x="595" y="180" font-size="12" font-weight="bold" fill="#DC2626">N</text>
  <text x="595" y="200" font-size="10" fill="#666">(1~2位主持人)</text>

  <!-- ==================== 联系"主持"的属性 ==================== -->
  <!-- 是否结项 -->
  <ellipse cx="340" cy="310" rx="38" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="340" y="314" text-anchor="middle" font-size="11">是否结项</text>
  <line x1="370" y1="300" x2="414" y2="288" stroke="#333" stroke-width="1.2"/>

  <!-- 到款金额 -->
  <ellipse cx="560" cy="310" rx="38" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="560" y="314" text-anchor="middle" font-size="11">到款金额</text>
  <line x1="532" y1="300" x2="488" y2="288" stroke="#333" stroke-width="1.2"/>

  <!-- ==================== 图例 ==================== -->
  <rect x="30" y="380" width="700" height="260" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="50" y="408" font-weight="bold" font-size="15" fill="#1E293B">图例 · 陈氏 ER 图符号</text>

  <!-- 实体 -->
  <rect x="50" y="425" width="60" height="30" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="125" y="445" font-size="12" fill="#334155">实体 (Entity) — 矩形</text>

  <!-- 属性 -->
  <ellipse cx="80" cy="475" rx="30" ry="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="125" y="480" font-size="12" fill="#334155">属性 (Attribute) — 椭圆</text>

  <!-- 联系 -->
  <polygon points="60,500 85,508 60,516 35,508" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="125" y="514" font-size="12" fill="#334155">联系 (Relationship) — 菱形</text>

  <!-- 连线 -->
  <line x1="50" y1="545" x2="110" y2="545" stroke="#333" stroke-width="1.5"/>
  <text x="125" y="550" font-size="12" fill="#334155">连线 — 标 1 / N / M 表示基数比</text>

  <!-- 主码标注 -->
  <ellipse cx="80" cy="577" rx="30" ry="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="95" y1="577" x2="125" y2="577" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="128" y="581" font-size="11" fill="#7C3AED">下划线 = 主码属性</text>

  <!-- 关键规则 -->
  <text x="50" y="618" font-size="12" fill="#DC2626">⚠ 选择 / 投影 / 连接 = 关系代数操作（线代数）；矩形 / 椭圆 / 菱形 = ER 图符号（几何图形）</text>
  <text x="50" y="640" font-size="12" fill="#64748B">属性的"归属"判断：成绩不是学生属性，而是"选课"联系的属性。同理，是否结项 / 到款金额是"主持"联系的属性。</text>
</svg>
