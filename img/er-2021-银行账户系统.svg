<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">

  <!-- ==================== 实体：客户 ==================== -->
  <rect x="100" y="100" width="110" height="55" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="155" y="133" text-anchor="middle" font-weight="bold" font-size="16">客户</text>

  <!-- 客户属性：客户编码 (主码，下划线) -->
  <ellipse cx="40" cy="60" rx="40" ry="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="40" y="64" text-anchor="middle" font-size="12">客户编码</text>
  <line x1="40" y1="46" x2="40" y2="42" stroke="#7C3AED" stroke-width="1.5"/>  <!-- 下划线代表主码 -->
  <line x1="60" y1="72" x2="110" y2="95" stroke="#333" stroke-width="1.2"/>

  <!-- 客户属性：姓名 -->
  <ellipse cx="155" cy="45" rx="30" ry="17" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="155" y="49" text-anchor="middle" font-size="12">姓名</text>
  <line x1="155" y1="62" x2="155" y2="100" stroke="#333" stroke-width="1.2"/>

  <!-- 客户属性：社保ID -->
  <ellipse cx="260" cy="60" rx="32" ry="17" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="260" y="64" text-anchor="middle" font-size="12">社保ID</text>
  <line x1="240" y1="72" x2="200" y2="95" stroke="#333" stroke-width="1.2"/>

  <!-- 客户属性：电话 (多值属性 = 双椭圆) -->
  <ellipse cx="100" cy="170" rx="32" ry="17" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.8"/>
  <ellipse cx="100" cy="170" rx="37" ry="21" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="100" y="174" text-anchor="middle" font-size="12">电话</text>
  <line x1="105" y1="155" x2="148" y2="138" stroke="#333" stroke-width="1.2"/>

  <!-- ==================== 实体：地址 ==================== -->
  <rect x="380" y="100" width="100" height="55" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="430" y="133" text-anchor="middle" font-weight="bold" font-size="16">地址</text>

  <!-- 地址属性：地址编码 (主码) -->
  <ellipse cx="350" cy="55" rx="40" ry="17" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="350" y="59" text-anchor="middle" font-size="12">地址编码</text>
  <line x1="350" y1="42" x2="365" y2="40" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="370" y1="64" x2="400" y2="95" stroke="#333" stroke-width="1.2"/>

  <!-- 地址属性：省份 -->
  <ellipse cx="430" cy="40" rx="28" ry="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="430" y="44" text-anchor="middle" font-size="12">省份</text>
  <line x1="430" y1="56" x2="430" y2="100" stroke="#333" stroke-width="1.2"/>

  <!-- 地址属性：城市 -->
  <ellipse cx="510" cy="60" rx="28" ry="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="510" y="64" text-anchor="middle" font-size="12">城市</text>
  <line x1="490" y1="72" x2="465" y2="95" stroke="#333" stroke-width="1.2"/>

  <!-- 地址属性：街道 -->
  <ellipse cx="510" cy="110" rx="28" ry="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="510" y="114" text-anchor="middle" font-size="12">街道</text>
  <line x1="488" y1="118" x2="472" y2="128" stroke="#333" stroke-width="1.2"/>

  <!-- ==================== 实体：账户 ==================== -->
  <rect x="620" y="330" width="100" height="55" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="670" y="363" text-anchor="middle" font-weight="bold" font-size="16">账户</text>

  <!-- 账户属性：账号 (主码) -->
  <ellipse cx="590" cy="295" rx="28" ry="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="590" y="299" text-anchor="middle" font-size="12">账号</text>
  <line x1="590" y1="282" x2="600" y2="280" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="605" y1="308" x2="638" y2="325" stroke="#333" stroke-width="1.2"/>

  <!-- 账户属性：账户类型 -->
  <ellipse cx="740" cy="300" rx="38" ry="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="740" y="304" text-anchor="middle" font-size="12">账户类型</text>
  <line x1="716" y1="312" x2="700" y2="328" stroke="#333" stroke-width="1.2"/>

  <!-- ==================== 实体：交易记录 ==================== -->
  <rect x="620" y="490" width="120" height="55" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="680" y="523" text-anchor="middle" font-weight="bold" font-size="16">交易记录</text>

  <!-- 交易记录属性 -->
  <ellipse cx="520" cy="480" rx="40" ry="17" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="520" y="484" text-anchor="middle" font-size="12">交易编码</text>
  <line x1="520" y1="467" x2="535" y2="465" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="555" y1="490" x2="620" y2="505" stroke="#333" stroke-width="1.2"/>

  <ellipse cx="520" cy="530" rx="38" ry="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="520" y="534" text-anchor="middle" font-size="12">交易类型</text>
  <line x1="552" y1="525" x2="620" y2="518" stroke="#333" stroke-width="1.2"/>

  <ellipse cx="780" cy="470" rx="38" ry="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="780" y="474" text-anchor="middle" font-size="12">交易日期</text>
  <line x1="752" y1="478" x2="732" y2="495" stroke="#333" stroke-width="1.2"/>

  <ellipse cx="790" cy="520" rx="38" ry="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="790" y="524" text-anchor="middle" font-size="12">交易金额</text>
  <line x1="758" y1="522" x2="742" y2="520" stroke="#333" stroke-width="1.2"/>

  <ellipse cx="790" cy="560" rx="38" ry="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="790" y="564" text-anchor="middle" font-size="12">交易对象</text>
  <line x1="758" y1="558" x2="742" y2="545" stroke="#333" stroke-width="1.2"/>

  <ellipse cx="680" cy="580" rx="28" ry="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="680" y="584" text-anchor="middle" font-size="12">余额</text>
  <line x1="680" y1="564" x2="680" y2="545" stroke="#333" stroke-width="1.2"/>

  <!-- ==================== 联系1：拥有地址 (客户-地址，1:N) ==================== -->
  <polygon points="250,190 300,210 250,230 200,210" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="250" y="215" text-anchor="middle" font-size="13">拥有</text>

  <!-- 客户 → 拥有 (1) -->
  <line x1="175" y1="155" x2="218" y2="198" stroke="#333" stroke-width="1.5"/>
  <text x="180" y="178" font-size="13" font-weight="bold" fill="#DC2626">1</text>

  <!-- 地址 ← 拥有 (N) -->
  <line x1="410" y1="155" x2="302" y2="199" stroke="#333" stroke-width="1.5"/>
  <text x="370" y="178" font-size="13" font-weight="bold" fill="#DC2626">N</text>

  <!-- ==================== 联系2：拥有账户 (客户-账户，1:N) ==================== -->
  <polygon points="280,340 330,360 280,380 230,360" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="280" y="365" text-anchor="middle" font-size="13">拥有</text>

  <!-- 客户 → 拥有 (1) -->
  <!-- Client bottom to diamond -->
  <line x1="155" y1="155" x2="260" y2="345" stroke="#333" stroke-width="1.5"/>
  <text x="200" y="250" font-size="13" font-weight="bold" fill="#DC2626">1</text>

  <!-- 账户 ← 拥有 (N) -->
  <line x1="620" y1="358" x2="330" y2="360" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="345" font-size="13" font-weight="bold" fill="#DC2626">N</text>

  <!-- ==================== 联系3：产生 (账户-交易记录，1:N) ==================== -->
  <polygon points="530,430 580,450 530,470 480,450" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="530" y="455" text-anchor="middle" font-size="13">产生</text>

  <!-- 账户 → 产生 (1) -->
  <line x1="650" y1="385" x2="560" y2="435" stroke="#333" stroke-width="1.5"/>
  <text x="615" y="408" font-size="13" font-weight="bold" fill="#DC2626">1</text>

  <!-- 交易记录 ← 产生 (N) -->
  <line x1="650" y1="490" x2="572" y2="462" stroke="#333" stroke-width="1.5"/>
  <text x="625" y="485" font-size="13" font-weight="bold" fill="#DC2626">N</text>

  <!-- ==================== 图例 ==================== -->
  <rect x="30" y="630" width="1040" height="200" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="50" y="660" font-weight="bold" font-size="16" fill="#1E293B">图例 · 陈氏 ER 图符号</text>

  <rect x="50" y="680" width="60" height="30" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="125" y="700" font-size="13" fill="#334155">实体 — 矩形</text>

  <ellipse cx="80" cy="730" rx="28" ry="13" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="125" y="735" font-size="13" fill="#334155">属性 — 椭圆（下划线 = 主码）</text>

  <ellipse cx="250" cy="700" rx="28" ry="13" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <ellipse cx="250" cy="700" rx="34" ry="17" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="310" y="705" font-size="13" fill="#334155">多值属性 — 双椭圆（如电话）</text>

  <polygon points="260,722 280,730 260,738 240,730" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="310" y="735" font-size="13" fill="#334155">联系 — 菱形（线上标 1 / N / M）</text>

  <text x="50" y="775" font-size="13" fill="#DC2626">关键判断：地址有自己的编码+结构(省份/城市/街道)，所以是实体而非属性。电话只是多值属性（双椭圆），无需独立实体。</text>
  <text x="50" y="800" font-size="13" fill="#64748B">但在转关系模式时，多值属性也要变成独立的表 → 联系电话(客户编码, 电话)。</text>

</svg>
