  <!-- ==================== 联系2：药品-批次 (1:N) ==================== -->
  <polygon points="410,150 450,168 410,186 370,168" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="410" y="173" text-anchor="middle" font-size="12">属于</text>

