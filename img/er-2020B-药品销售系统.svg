  <line x1="530" y1="110" x2="450" y2="157" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="133" font-size="12" font-weight="bold" fill="#DC2626">N</text>

  <!-- ==================== 实体：销售网点（中左） ==================== -->
  <rect x="50" y="280" width="120" height="50" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="110" y="310" text-anchor="middle" font-weight="bold" font-size="15">销售网点</text>

  <ellipse cx="30" cy="245" rx="36" ry="15" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="30" y="249" text-anchor="middle" font-size="11">网点号</text>
  <line x1="30" y1="233" x2="45" y2="231" stroke="#7C3AED" stroke-width="1.3"/>
  <line x1="50" y1="255" x2="80" y2="275" stroke="#333" stroke-width="1.2"/>

  <ellipse cx="110" cy="240" rx="36" ry="15" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="110" y="244" text-anchor="middle" font-size="11">网点名称</text>
  <line x1="110" y1="255" x2="110" y2="280" stroke="#333" stroke-width="1.2"/>

  <ellipse cx="190" cy="270" rx="28" ry="15" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="190" y="274" text-anchor="middle" font-size="11">地址</text>
  <line x1="175" y1="280" x2="165" y2="290" stroke="#333" stroke-width="1.2"/>

  <!-- ==================== 实体：库位（中） ==================== -->
  <rect x="270" y="280" width="100" height="50" rx="0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="320" y="310" text-anchor="middle" font-weight="bold" font-size="15">库位</text>

  <ellipse cx="250" cy="245" rx="32" ry="15" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="250" y="249" text-anchor="middle" font-size="11">库位号</text>
  <line x1="250" y1="233" x2="263" y2="231" stroke="#7C3AED" stroke-width="1.3"/>
  <line x1="270" y1="255" x2="295" y2="275" stroke="#333" stroke-width="1.2"/>

  <ellipse cx="390" cy="270" rx="36" ry="15" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
